<!-- 🔮 PlasmaOrb.svg — Orb de loading Plasmmer -->
<!-- Uso: <img src="PlasmaOrb.svg" alt="Carregando..." /> -->
<!-- Ou inline no JSX como <PlasmaOrb /> -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80"
  role="img" aria-label="Carregando identidade Plasmmer">

  <defs>
    <!-- Gradiente cônico plasma: violet → indigo → cyan → violet -->
    <linearGradient id="plasma-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7C3AED"/>
      <stop offset="40%"  stop-color="#6366F1"/>
      <stop offset="80%"  stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Gradiente inner glow (mais suave) -->
    <radialGradient id="plasma-inner" cx="40%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#C4B5FD" stop-opacity="0.9"/>
      <stop offset="50%"  stop-color="#818CF8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow filter externo -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Clip circular -->
    <clipPath id="circle-clip">
      <circle cx="40" cy="40" r="30"/>
    </clipPath>

    <!-- Máscara do trail de rotação -->
    <mask id="trail-mask">
      <circle cx="40" cy="40" r="36" fill="white"/>
      <circle cx="40" cy="40" r="24" fill="black"/>
    </mask>
  </defs>

  <!-- ── Glow externo (pulsa) ── -->
  <circle cx="40" cy="40" r="36"
    fill="none"
    stroke="url(#plasma-grad-1)"
    stroke-width="1"
    opacity="0.4"
    filter="url(#glow)">
    <animate attributeName="r" values="34;38;34" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- ── Anel de fundo (estático, sutil) ── -->
  <circle cx="40" cy="40" r="30"
    fill="none"
    stroke="#E0E7FF"
    stroke-width="4"
    opacity="0.6"/>

  <!-- ── Anel girando (o plasma arc) ── -->
  <g filter="url(#glow)">
    <circle cx="40" cy="40" r="30"
      fill="none"
      stroke="url(#plasma-grad-1)"
      stroke-width="4"
      stroke-linecap="round"
      stroke-dasharray="62 128"
      stroke-dashoffset="0">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 40 40"
        to="360 40 40"
        dur="1.4s"
        repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ── Anel contra-girando (cria efeito plasma duplo) ── -->
  <g filter="url(#glow)" opacity="0.5">
    <circle cx="40" cy="40" r="30"
      fill="none"
      stroke="#06B6D4"
      stroke-width="2"
      stroke-linecap="round"
      stroke-dasharray="30 158">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="360 40 40"
        to="0 40 40"
        dur="2.2s"
        repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ── Esfera interna (o "core" do plasma) ── -->
  <circle cx="40" cy="40" r="24"
    fill="url(#plasma-inner)"
    opacity="0.85">
    <animate attributeName="opacity" values="0.75;0.95;0.75" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- ── Logo Plasmmer no centro (P estilizado) ── -->
  <!-- Substituir pelo SVG real do logo -->
  <g opacity="0.9">
    <text
      x="40" y="46"
      text-anchor="middle"
      font-family="Inter, -apple-system, sans-serif"
      font-size="18"
      font-weight="700"
      fill="white"
      filter="url(#glow)">
      P
    </text>
  </g>

  <!-- ── Partículas orbitando (3 dots) ── -->
  <!-- Partícula 1 -->
  <circle r="3" fill="#7C3AED" filter="url(#glow)">
    <animateMotion
      path="M40,40 m-30,0 a30,30 0 1,1 60,0 a30,30 0 1,1 -60,0"
      dur="1.4s"
      repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Partícula 2 (defasada 120°) -->
  <circle r="2.5" fill="#06B6D4" filter="url(#glow)">
    <animateMotion
      path="M40,40 m-30,0 a30,30 0 1,1 60,0 a30,30 0 1,1 -60,0"
      dur="1.4s"
      begin="-0.47s"
      repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="-0.47s" repeatCount="indefinite"/>
  </circle>

  <!-- Partícula 3 (defasada 240°) -->
  <circle r="2" fill="#A78BFA" filter="url(#glow)">
    <animateMotion
      path="M40,40 m-30,0 a30,30 0 1,1 60,0 a30,30 0 1,1 -60,0"
      dur="1.4s"
      begin="-0.93s"
      repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="-0.93s" repeatCount="indefinite"/>
  </circle>
</svg>
